<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Revizák Scan Pro – v2.7.6 (Full Date Check)</title>
    <script src="https://unpkg.com/html5-qrcode"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.3.2/papaparse.min.js"></script>
    <style>
        :root { --primary: #007bff; --success: #28a745; --danger: #dc3545; --dark: #333; }
        body { font-family: -apple-system, sans-serif; margin: 0; padding: 15px; background: #f4f4f9; -webkit-tap-highlight-color: transparent; }
        .card { background: white; padding: 15px; border-radius: 12px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); margin-bottom: 15px; }
        label { display: block; margin-top: 10px; font-weight: bold; font-size: 0.85rem; color: #555; }
        input, select { width: 100%; padding: 12px; margin: 5px 0 10px 0; border: 1px solid #ccc; border-radius: 6px; box-sizing: border-box; font-size: 1rem; }
        button { width: 100%; padding: 15px; border: none; border-radius: 8px; font-weight: bold; font-size: 1rem; cursor: pointer; color: white; margin-bottom: 10px; }
        .btn-success { background: var(--success); }
        .btn-primary { background: var(--primary); }
        .btn-danger { background: var(--danger); }
        .btn-outline { background: none; color: #666; border: 1px solid #ccc; }
        #reader { width: 100%; max-width: 300px; margin: 15px auto; border-radius: 12px; overflow: hidden; background: #000; border: 2px solid #ddd; }
        .hidden { display: none; }
        .flex-row { display: flex; gap: 10px; }
        .header-box { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
    </style>
</head>
<body>

<div id="setup-step">
    <div class="card">
        <h2>1. Nahrát CSV (Originál nebo Export)</h2>
        <input type="file" id="csv-file" accept=".csv">
    </div>
</div>

<div id="scan-step" class="hidden">
    <div class="header-box">
        <h2 style="margin:0;">Skenovat</h2>
        <button onclick="openAddModal()" style="width:auto; padding:10px 20px; margin:0;" class="btn-primary">+ Nový</button>
    </div>
    <div class="card" style="text-align: center;">
        <div id="reader"></div>
        <button onclick="restartScanner()" class="btn-outline" style="padding: 8px; font-size: 0.8rem; width: auto; margin-bottom: 15px;">🔄 Restartovat kameru</button>
        <input type="text" id="manual-search" placeholder="Zadejte ID ručně...">
        <button class="btn-primary" onclick="searchById(document.getElementById('manual-search').value)">Hledat</button>
    </div>
    <button onclick="downloadFinalCSV()" style="background:var(--dark); height: 60px;">3. GENEROVAT EXPORT (CSV)</button>
    <button onclick="manualReset()" class="btn-outline" style="color:var(--danger); border-color:var(--danger); margin-top:40px;">RESETOVAT DATA</button>
</div>

<div id="form-step" class="hidden">
    <div class="card">
        <h3>ID: <span id="display-id" style="color:var(--primary)"></span></h3>
        <p id="display-name" style="font-weight:bold; color:#333;"></p>
        <hr>
        <label>Rpe</label> <input type="text" id="field-Rpe" inputmode="decimal">
        <label>IdifEq</label> <input type="text" id="field-IdifEq" inputmode="decimal">
        <label>IdifTouch</label> <input type="text" id="field-IdifTouch" inputmode="decimal">
        <label>RisoM_PE</label> <input type="text" id="field-Riso" value=">19,99">
        
        <div class="flex-row" style="margin-top:20px;">
            <button class="btn-danger" style="flex: 1;" onclick="saveData(true)">KO</button>
            <button class="btn-success" style="flex: 2;" onclick="saveData(false)">ULOŽIT OK</button>
        </div>
        <button class="btn-outline" onclick="showScan()">ZPĚT</button>
    </div>
</div>

<script>
    const MOJE_UDAJE = {
        TechName: "Pavel", TechSurname: "Král", TechLicence: "5288/25/R-EZ-E2A",
        TechPhone: "732362287", TechEmail: "pavel.kral96@seznam.cz",
        DevName: "BENNING ST 710", DevSerialNumber: "48N-0093"
    };

    let csvData = [];
    let csvHeaders = [];
    let currentIndex = -1;
    let scanner = new Html5Qrcode("reader");

    window.onload = () => {
        const d = localStorage.getItem('revize_data');
        const h = localStorage.getItem('revize_headers');
        if (d && h) {
            csvData = JSON.parse(d);
            csvHeaders = JSON.parse(h);
            document.getElementById('setup-step').classList.add('hidden');
            document.getElementById('scan-step').classList.remove('hidden');
            setTimeout(startScanner, 500);
        }
    };

    document.getElementById('csv-file').onchange = function(e) {
        const file = e.target.files[0];
        if (!file) return;
        const reader = new FileReader();
        reader.onload = function(event) {
            Papa.parse(event.target.result, {
                header: true, skipEmptyLines: true, delimiter: ";",
                complete: function(results) {
                    csvData = results.data.filter(r => r.IdText).map(row => {
                        return {...row, _wasMeasuredToday: false};
                    });
                    csvHeaders = results.meta.fields; 
                    localStorage.setItem('revize_data', JSON.stringify(csvData));
                    localStorage.setItem('revize_headers', JSON.stringify(csvHeaders));
                    location.reload(); 
                }
            });
        };
        reader.readAsText(file, 'windows-1250');
    };

    function startScanner() {
        scanner.start({ facingMode: "environment" }, { fps: 15, qrbox: 200 }, (t) => {
            scanner.pause(true); searchById(t);
        }).catch(err => console.log(err));
    }

    function restartScanner() { scanner.stop().then(() => { startScanner(); }).catch(() => { startScanner(); }); }

    function searchById(id) {
        const idx = csvData.findIndex(r => String(r.IdText).trim() === String(id).trim());
        if (idx !== -1) openForm(idx);
        else { alert("Nenalezeno"); if(scanner.getState() === 3) scanner.resume(); }
    }

    function openForm(idx) {
        currentIndex = idx;
        const row = csvData[idx];
        document.getElementById('display-id').innerText = row.IdText || "";
        document.getElementById('display-name').innerText = row.Name || "";
        document.getElementById('field-Rpe').value = row.Rpe || "";
        document.getElementById('field-IdifEq').value = row.IdifEq || "";
        document.getElementById('field-IdifTouch').value = row.IdifTouch || "";
        document.getElementById('scan-step').classList.add('hidden');
        document.getElementById('form-step').classList.remove('hidden');
    }

    function saveData(isFailed) {
        const row = csvData[currentIndex];
        const now = new Date();
        const dateStr = now.toLocaleDateString('cs-CZ').replace(/\s/g, '') + " 0:00:00";
        row._wasMeasuredToday = true;
        row.LastRev = dateStr; row.Date = dateStr; row.Time = now.toLocaleTimeString('cs-CZ');
        row.AutoRev = "True";
        row.Rpe = document.getElementById('field-Rpe').value.replace('.', ',');
        row.IdifEq = document.getElementById('field-IdifEq').value.replace('.', ',');
        row.IdifTouch = document.getElementById('field-IdifTouch').value.replace('.', ',');
        row.RisoM_PE = document.getElementById('field-Riso').value.replace('.', ',');
        row.Result = isFailed ? "Failed" : "Passed";
        row.ResultTotal = row.Result;
        Object.assign(row, MOJE_UDAJE);
        if(row.Interval) {
            let next = new Date(); 
            next.setMonth(next.getMonth() + parseInt(row.Interval));
            row.NextRev = next.toLocaleDateString('cs-CZ').replace(/\s/g, '') + " 0:00:00";
        }
        localStorage.setItem('revize_data', JSON.stringify(csvData));
        showScan();
    }

    // PŘESNÁ KONTROLA DATA (DEN, MĚSÍC, ROK)
    function isRevisionStillValid(nextRevStr) {
        if (!nextRevStr || nextRevStr.trim() === "") return false;
        try {
            // Illko formát: "15.02.2025 0:00:00" nebo "15.02.2025"
            const datePart = nextRevStr.split(' ')[0];
            const parts = datePart.split('.');
            if (parts.length < 3) return false;
            
            // JavaScript Date bere měsíce od 0 do 11
            const nextRevDate = new Date(parts[2], parts[1] - 1, parts[0]);
            const today = new Date();
            today.setHours(0, 0, 0, 0); // Vynulujeme čas pro přesné porovnání jen kalendářního dne
            
            // Pokud je příští revize po dnešku (zítra a dál), vracíme true (je platná)
            return nextRevDate > today;
        } catch(e) { 
            return false; 
        }
    }

    function downloadFinalCSV() {
        let csvRows = [csvHeaders.join(';')];
        const fieldsToReset = ["LastRev", "Date", "Time", "ResultTotal", "ResultVisual", "ResultFunct", "ResultMeas", "TechName", "TechSurname", "TechLicence", "TechEmail", "TechPhone", "DevName", "DevSerialNumber", "Rpe", "IdifEq", "IdifTouch", "RisoM_PE", "MeasNote"];
        
        csvData.forEach(row => {
            if (!row.IdText) return;
            let fRow = {...row};
            
            // PODMÍNKA: Pokud nebylo pípnuté dnes A ZÁROVEŇ revize už propadla (je dnes nebo byla včera a dřív)
            if (!fRow._wasMeasuredToday && !isRevisionStillValid(fRow.NextRev)) {
                fRow.LastRev = "01.01.1970 0:00:00"; 
                fRow.Result = "Failed"; 
                fRow.Note = "Nenalezeno"; 
                fRow.Archive = "False";
                fRow.AutoRev = "True";
                fieldsToReset.forEach(f => { if(fRow[f] !== undefined) fRow[f] = ""; });
                if(fRow.Interval) {
                    let d = new Date(1970, 0, 1); 
                    d.setMonth(d.getMonth() + parseInt(fRow.Interval));
                    fRow.NextRev = d.toLocaleDateString('cs-CZ').replace(/\s/g, '') + " 0:00:00";
                }
            }
            
            let values = csvHeaders.map(h => {
                let v = fRow[h] === undefined || fRow[h] === null ? "" : String(fRow[h]);
                // Ošetření uvozovek u textových polí s diakritikou pro Excel/Illko
                return (v === "" || /^[0-9,.]+$/.test(v.replace('>', '')) || v.includes(':')) ? v : `"${v}"`;
            });
            csvRows.push(values.join(';'));
        });
        const blob = new Blob(["\uFEFF" + csvRows.join('\r\n')], { type: 'text/csv;charset=utf-8;' });
        const link = document.createElement("a"); link.href = URL.createObjectURL(blob); link.download = "export_illko.csv"; link.click();
    }

    function showScan() { document.getElementById('form-step').classList.add('hidden'); document.getElementById('scan-step').classList.remove('hidden'); if(scanner.getState() === 3) scanner.resume(); }
    function manualReset() { if(confirm("Smazat vše?")) { localStorage.clear(); location.reload(); } }
</script>
</body>
</html>
